name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "I can't tell which project my spend came from."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: who
    attributes:
      label: How do you use Cursor?
      options: [Solo developer, Power user / agents, Freelancer / consultant, Team lead / manager, Other]
